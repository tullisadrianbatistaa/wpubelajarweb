<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Galau</title>
  <style>
    body {
      background-color: #0F1629;
      font-family: 'Courier New', Courier, monospace;
    }

    h1 {
      color: #37BDF0;
      font-size: 50px;
      text-align: center;
      text-transform: uppercase;
      word-spacing: 10px;
      font-style: italic;
      letter-spacing: 5px;
      text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: #333f57;
    }

    p {
      color: #EFF1FB;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      line-height: 2em;
    }

    #p2 {
      font-size: 10px;
      color: grey;
      letter-spacing: 2px;
      font-weight: normal;
    }

    span {
      color: #CC163E;
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <h1>fase runtuh</h1>
  <p>"Tak perlu khawatir, ku hanya <span>terluka</span>.<br>
    Terbiasa tuk pura-pura tertawa.<br>
    Namun bolehkan sekali saja ku menangis?<br>
    Sebelum kembali membohongi diri."</p><br>
  <p id="p2">- feby putri feat. fiersa besari</p>
</body>
</html>
