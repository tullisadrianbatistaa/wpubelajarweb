<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Galau</title>
  <style>
    body {
      background-color: #0F172A;
      font-family: 'Courier New', Courier, monospace;
      background-image: linear-gradient(to bottom, rgb(15 23 41 / 90%) 50%, rgb(15 23 42 / 40%)), url('https://picsum.photos/id/10/1000/1000');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      min-height: 100vh;
      text-align: center;
    }

    h1 {
      color: transparent;
      font-size: 4em;
      text-transform: uppercase;
      word-spacing: 10px;
      font-style: italic;
      letter-spacing: 5px;
      text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
      background-image: linear-gradient(to right, rgb(0, 162, 255) 30%, rgb(96, 246, 3));
      background-clip: text;
      filter: drop-shadow(0 0 10px rgba(102, 235, 228, 0.5));
    }

    .p2 {
      color: #EFF1FB;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      line-height: 2em;
      background-color: rgb(255 255 255 / 5%);
      max-width: 600px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgb(255 255 255 / 10%);
      box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
    }
    
    #p3 {
      font-size: 10px;
      color: grey;
      letter-spacing: 2px;
      font-weight: normal;
      text-transform: uppercase;
      border-top: 1px solid rgb(255 255 255 / 10%);
      width: 30%;
      margin: 20px auto;
      padding-top: 20px;
    }

    span {
      color: #CC163E;
      text-shadow: 0 0 10px rgb(220 20 60 / 89%);
    }
  </style>
</head>
<body>
  <h1>fase runtuh</h1>
  <p class="p2">"Tak perlu khawatir, ku hanya <span>terluka</span>.<br>
    Terbiasa tuk pura-pura tertawa.<br>
    Namun bolehkan sekali saja ku menangis?<br>
    Sebelum kembali membohongi diri."</p><br>
  <p id="p3">- feby putri feat. fiersa besari</p>
</body>
</html>
