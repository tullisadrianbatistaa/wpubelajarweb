<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Background</title>
  <style>
    body {
      background-color: lightblue;
      background-image: linear-gradient(to right top, green 50%, blue, purple, yellow);
      height: 100vh;
    }

    .kotak1 {
      width: 200px;
      height: 200px;
      background-image: linear-gradient(to bottom, lightblue, salmon);
    }

    .kotak2 {
      width: 200px;
      height: 200px;
      background-image: radial-gradient(blue, red);
    }

    .kotak3 {
      width: 200px;
      height: 200px;
      background-image: conic-gradient(red, blue, green);
    }
  </style>
</head>
<body>
  <div class="kotak1"></div>
  <div class="kotak2"></div>
  <div class="kotak3"></div>
</body>
</html>
