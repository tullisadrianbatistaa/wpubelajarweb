<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Elemen Form didalam Tabel</title>
</head>
<body>
  <h1>Contoh elemen-elemen form pada HTML</h1>
  <form>

    <table cellpadding="5">
      <tr>
        <td align="right"><label for="nama">Nama: </label></td>
        <td><input type="text" id="nama" name="nama" placeholder="Masukkan nama"></td>
      </tr>
      <tr>
        <td align="right"><label for="password">Password: </label></td>
        <td><input type="password" id="password" name="password" placeholder="Masukkan password"></td>
      </tr>
      <tr>
        <td align="right"><label for="email">Email: </label></td>
        <td><input type="email" name="email" id="email" placeholder="Masukkan Email"></td>
      </tr>
      <tr>
        <td align="right"><label for="angka">Angka:</label></td>
        <td><input type="number" name="number" id="angka" min="0" max="50" step="5"></td>
      </tr>
      <tr>
        <td align="right"><label for="tanggal">Tanggal:</label></td>
        <td><input type="date" name="date" id="tanggal"></td>
      </tr>
      <tr>
        <td align="right"><label for="warna">Warna:</label></td>
        <td><input type="color" name="color" id="warna"></td>
      </tr>
      <tr>
        <td colspan="2">
          <button type="submit">Kirim</button>
        </td>
      </tr>
    </table>

  </form>
</body>
</html>
