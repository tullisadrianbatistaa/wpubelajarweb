<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select & Textarea</title>
</head>
<body>
  <form>
    <h3>Pilih Kota</h3>
    <select name="kota" id="kota">
      <option>--Pilih Kota--</option>
      <option value="ptk">Pontianak</option>
      <option value="snt">Sintang</option>
      <option value="pts">Putussibau</option>
    </select>
    <br><br>
    <h3>Data Diri Anda</h3>
    <textarea name="about" id="about" cols="50" rows="10" placeholder="isi data anda"></textarea>
    <br><br> 
    <button type="submit">Kirim</button>
  </form>
</body>
</html>
